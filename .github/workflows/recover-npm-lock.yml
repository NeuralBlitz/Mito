name: One-time npm lockfile recovery

on:
  push:
    branches:
      - fix/2026-11-11-npm-lock-recovery
    paths:
      - package.json
      - .github/workflows/recover-npm-lock.yml

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Recreate invalid lockfile without running install scripts
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e "const lock=require('./package-lock.json');if(!lock.packages || !lock.packages[''])process.exit(1)"
      - name: Commit reproducible lockfile to the repair branch
        run: |
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(deps): regenerate valid npm lockfile'
          git push origin HEAD:fix/2026-11-11-npm-lock-recovery
