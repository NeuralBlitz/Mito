name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cpp-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile C++ CLI and verify entry points
        run: |
          make all
          ./llama-cli --version
          ./llama-cli --help

  python-api-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight API-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest httpx "fastapi>=0.100" "uvicorn>=0.23" "pydantic>=2" "python-jose[cryptography]>=3.3" "python-multipart>=0.0.9" "prometheus-client>=0.17" "pyyaml>=6.0"
      - name: Compile Python modules
        run: python -m compileall -q server config agents tests
      - name: Validate API imports and FastAPI route signatures
        run: python -m pytest tests/test_server.py tests/test_api_security.py -q

  node-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Validate root npm lockfile and install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate desktop npm lockfile and install
        working-directory: desktop
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build desktop production assets
        working-directory: desktop
        run: npm run build
