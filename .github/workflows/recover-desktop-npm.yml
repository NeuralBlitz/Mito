name: One-time desktop npm lock recovery

on:
  push:
    branches:
      - fix/2026-11-11-npm-lock-recovery
    paths:
      - desktop/package.json
      - .github/workflows/recover-desktop-npm.yml

permissions:
  contents: write

jobs:
  recover-desktop-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Recreate lockfile using compatible Vue/Vite peer versions
        working-directory: desktop
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e "const p=require('./package.json');const l=require('./package-lock.json');if(!l.packages || l.packages[''].devDependencies['@vitejs/plugin-vue']!==p.devDependencies['@vitejs/plugin-vue'])process.exit(1)"
      - name: Commit regenerated lockfile
        run: |
          git add desktop/package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(desktop): regenerate compatible Vue/Vite npm lockfile'
          git push origin HEAD:fix/2026-11-11-npm-lock-recovery
