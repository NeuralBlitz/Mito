services:
  mito-api:
    build:
      # Compose resolves these paths relative to deploy/docker-compose.yml.
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      # Local-only default until API authentication has been hardened.
      - "127.0.0.1:8000:8000"
    environment:
      - MITO_HOME=/app
      - PYTHONUNBUFFERED=1
    volumes:
      - ../models:/app/models
      - ../data:/app/data
    restart: unless-stopped

# The former mito-worker referenced a nonexistent "python -m mito worker"
# entry point. Reintroduce the service only when a worker is implemented.
networks:
  default:
    name: mito-network
